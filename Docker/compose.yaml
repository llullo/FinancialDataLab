services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: financial-data-lab-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: "no"

volumes:
  sqlserver_data: